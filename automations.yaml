- id: '1775259577858'
  alias: ПЕРЕКЛЮЧИТЬ ЛЮСТРУ В СПАЛЬНЕ ПО ВЫКЛЮЧАТЕЛЮ
  description: ''
  triggers:
  - trigger: event
    event_type: zha_event
  conditions:
  - condition: template
    value_template: "{{ trigger.event.data.device_ieee == '00:15:8d:00:03:9b:31:68' }}"
  actions:
  - action: light.toggle
    metadata: {}
    data: {}
    target:
      entity_id: light.liustra
  mode: single
- id: '1778670185980'
  alias: "Motion Detection: auto-enable after 4 hours"
  description: "Re-enables motion detection on esp32-c3-light if left off for 4 hours."
  triggers:
    - trigger: state
      entity_id: switch.motion_detection
      to: "off"
      for:
        hours: 4
  conditions: []
  actions:
    - action: switch.turn_on
      target:
        entity_id: switch.motion_detection
  mode: single
