# Network devices inventory (router-cli) exposed to the network-devices Lovelace card.
# Calls go through the host action bridge (ha-host-actions, 172.20.0.1:8787), which runs
# `router inventory list|update|scan|reserve|unreserve|alias` with validated argv. After a
# reserve/unreserve the bridge runs one `router inventory update`, so the card sees the change.
# The card calls these with return_response via the authenticated websocket API —
# the inventory is never served from /local (public through the Dataplicity tunnel).
#
# ROUTER POLLING BUDGET (the Ubee web server hangs when polled often):
#   - systemd user timer router-inventory-update.timer: `router inventory update` once an hour;
#   - rest_command.network_update (card "Обновить" button, button.network_devices_update):
#     on demand; the bridge serializes it and reuses a poll younger than 60 s.
# Nothing else here touches the router: network_inventory and the sensors below read the
# local inventory DB through the bridge. This replaces the old `ubee` integration.

rest:
  # Local-DB summary for automations (GET /network/summary; never polls the router).
  - resource: !secret host_network_summary_url
    method: GET
    headers:
      X-HA-Host-Token: !secret host_actions_token
    scan_interval: 300
    timeout: 25
    sensor:
      - name: "Network devices online"
        unique_id: network_devices_online
        icon: mdi:lan-connect
        unit_of_measurement: "devices"
        state_class: measurement
        value_template: "{{ value_json.online_count }}"
        # online_macs / online_names for templates, e.g.
        #   {{ '02:00:00:00:00:01' in state_attr('sensor.network_devices_online', 'online_macs') }}
        json_attributes:
          - known_count
          - reserved_count
          - last_poll
          - online
          - online_macs
          - online_names
          - new_24h
      - name: "Network inventory last poll"
        unique_id: network_inventory_last_poll
        icon: mdi:router-network
        device_class: timestamp
        value_template: "{{ value_json.last_poll if value_json.last_poll else none }}"

template:
  - button:
      - name: "Network devices update"
        unique_id: network_devices_update
        icon: mdi:refresh
        press:
          - action: rest_command.network_update
          - action: homeassistant.update_entity
            target:
              entity_id:
                - sensor.network_devices_online
                - sensor.network_inventory_last_poll

rest_command:
  # Polls the router now (router inventory update). The bridge waits for a running poll
  # instead of starting a second one, so the timeout covers one full poll.
  network_update:
    url: !secret host_network_update_url
    method: POST
    headers:
      X-HA-Host-Token: !secret host_actions_token
    content_type: "application/json"
    payload: "{}"
    timeout: 110

  network_inventory:
    url: !secret host_network_inventory_url
    method: POST
    headers:
      X-HA-Host-Token: !secret host_actions_token
    content_type: "application/json"
    payload: >-
      {"filter": {{ filter | default("all", true) | to_json }}, "since": {{ since | default("", true) | to_json }}, "favicons": {{ favicons | default(true) | to_json }}}
    timeout: 25

  network_scan:
    url: !secret host_network_scan_url
    method: POST
    headers:
      X-HA-Host-Token: !secret host_actions_token
    content_type: "application/json"
    payload: >-
      {"ip": {{ ip | default("", true) | to_json }}}
    timeout: 30

  network_pin:
    url: !secret host_network_pin_url
    method: POST
    headers:
      X-HA-Host-Token: !secret host_actions_token
    content_type: "application/json"
    payload: >-
      {"mac": {{ mac | to_json }}, "ip": {{ ip | to_json }}, "name": {{ name | default("", true) | to_json }}, "dry_run": {{ dry_run | default(false) | to_json }}}
    # write + one `router inventory update` so the card sees the new reservation at once
    timeout: 125

  network_unpin:
    url: !secret host_network_unpin_url
    method: POST
    headers:
      X-HA-Host-Token: !secret host_actions_token
    content_type: "application/json"
    payload: >-
      {"mac": {{ mac | to_json }}, "dry_run": {{ dry_run | default(false) | to_json }}}
    timeout: 125

  # All static-lease slots taken: free replace_mac's reservation and pin mac to ip in one call.
  # The bridge restores the old reservation if the new one fails.
  network_pin_replace:
    url: !secret host_network_pin_replace_url
    method: POST
    headers:
      X-HA-Host-Token: !secret host_actions_token
    content_type: "application/json"
    payload: >-
      {"replace_mac": {{ replace_mac | to_json }}, "mac": {{ mac | to_json }}, "ip": {{ ip | to_json }}, "name": {{ name | default("", true) | to_json }}, "dry_run": {{ dry_run | default(false) | to_json }}}
    timeout: 170

  network_alias:
    url: !secret host_network_alias_url
    method: POST
    headers:
      X-HA-Host-Token: !secret host_actions_token
    content_type: "application/json"
    payload: >-
      {"mac": {{ mac | to_json }}, "name": {{ name | default("", true) | to_json }}, "icon": {{ icon | default("", true) | to_json }}}
    timeout: 20

  # Per-device activity (card sparklines and detail drawer): hourly buckets
  # {"mac", "buckets": [{"t", "online_ratio", "rx_bytes", "tx_bytes"}]} from the local DB.
  network_history:
    url: !secret host_network_history_url
    method: POST
    headers:
      X-HA-Host-Token: !secret host_actions_token
    content_type: "application/json"
    payload: >-
      {"device": {{ device | to_json }}, "days": {{ days | default(7) | int }}}
    timeout: 25

  # Network-wide summary for the card header: online_now, online_avg, per_hour, top_traffic.
  network_stats:
    url: !secret host_network_stats_url
    method: POST
    headers:
      X-HA-Host-Token: !secret host_actions_token
    content_type: "application/json"
    payload: >-
      {"days": {{ days | default(7) | int }}}
    timeout: 25
