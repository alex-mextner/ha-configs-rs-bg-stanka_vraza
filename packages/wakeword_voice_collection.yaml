# Wake word real positive collection tooling.

input_select:
  wakeword_collection_phrase:
    name: "Wakeword phrase"
    icon: mdi:form-textbox
    options:
      - "эй Милош"
      - "Милош"

  wakeword_collection_speaker:
    name: "Wakeword speaker"
    icon: mdi:account-voice
    options:
      - "speaker_1_owner"
      - "speaker_2"
      - "speaker_3"
      - "guest"

  wakeword_collection_style:
    name: "Wakeword style"
    icon: mdi:volume-high
    options:
      - "normal"
      - "whisper"
      - "loud"
      - "far"
      - "other_room"
      - "moving"
      - "tired"

  wakeword_collection_location:
    name: "Wakeword location/noise"
    icon: mdi:map-marker-sound
    options:
      - "near_satellite_1m_quiet"
      - "sofa_3m_quiet"
      - "kitchen_noise"
      - "hallway"
      - "doorway"
      - "tv_or_music_noise"
      - "conversation_noise"

input_number:
  wakeword_collection_expected_attempts:
    name: "Wakeword expected attempts"
    icon: mdi:counter
    min: 5
    max: 100
    step: 5
    initial: 30

  wakeword_collection_plan_step:
    name: "Wakeword plan step"
    icon: mdi:progress-clock
    min: 1
    max: 12
    step: 1
    initial: 1

input_text:
  wakeword_collection_notes:
    name: "Wakeword collection notes"
    icon: mdi:notebook-edit-outline
    max: 255
    initial: ""

input_boolean:
  wakeword_collection_active:
    name: "Wakeword collection active"
    icon: mdi:record-circle-outline
    initial: false

input_button:
  wakeword_collection_show_guide:
    name: "Wakeword show guide"
    icon: mdi:help-circle-outline

  wakeword_collection_start:
    name: "Wakeword start session"
    icon: mdi:record-rec

  wakeword_collection_finish:
    name: "Wakeword finish session"
    icon: mdi:stop-circle-outline

  wakeword_collection_next_block:
    name: "Wakeword mark block done"
    icon: mdi:check-circle-outline

counter:
  wakeword_collection_blocks_done:
    name: "Wakeword blocks done"
    icon: mdi:playlist-check
    initial: 0
    step: 1

shell_command:
  wakeword_positive_session_start: >-
    python3 /config/scripts/wakeword_real_positive_session.py
    --dataset-root /config/oww-dataset
    --debug-root /config/wyoming-debug
    start
    --phrase '{{ phrase }}'
    --speaker {{ speaker }}
    --style {{ style }}
    --location {{ location }}
    --expected-attempts {{ expected_attempts }}
  wakeword_positive_session_finish: >-
    python3 /config/scripts/wakeword_real_positive_session.py
    --dataset-root /config/oww-dataset
    --debug-root /config/wyoming-debug
    finish
    --expected-attempts {{ expected_attempts }}

command_line:
  - sensor:
      name: "Wakeword Positive Session"
      unique_id: wakeword_positive_session
      command: "python3 /config/scripts/wakeword_real_positive_session.py --dataset-root /config/oww-dataset --debug-root /config/wyoming-debug report"
      scan_interval: 10
      value_template: "{{ 'active' if value_json.active else 'idle' }}"
      json_attributes:
        - active
        - id
        - started_at
        - phrase
        - speaker
        - style
        - location
        - expected_attempts
        - wake_files_since_start
        - debug_root
        - real_positive_files_total
        - session_summaries_total
        - latest_summary
  - sensor:
      name: "Wakeword Mic Direction"
      unique_id: wakeword_mic_direction
      command: "python3 /config/scripts/wakeword_array_status.py --status-file /config/oww-dataset/wakeword_array_status.json json"
      scan_interval: 1
      unit_of_measurement: "°"
      value_template: >-
        {% if value_json.state == 'ok' and value_json.direction_degrees is not none %}
          {{ value_json.direction_degrees }}
        {% else %}
          unknown
        {% endif %}
      json_attributes:
        - state
        - updated_at
        - age_seconds
        - level_dbfs
        - confidence
        - source
        - channel_rms
        - channel_peaks
  - sensor:
      name: "Wakeword Mic Level"
      unique_id: wakeword_mic_level
      command: "python3 /config/scripts/wakeword_array_status.py --status-file /config/oww-dataset/wakeword_array_status.json json"
      scan_interval: 1
      unit_of_measurement: "dBFS"
      value_template: >-
        {% if value_json.state == 'ok' and value_json.level_dbfs is not none %}
          {{ value_json.level_dbfs }}
        {% else %}
          unknown
        {% endif %}
      json_attributes:
        - state
        - updated_at
        - age_seconds
        - direction_degrees
        - confidence
        - source

template:
  - sensor:
      - name: "Wakeword Collection Progress"
        unique_id: wakeword_collection_progress
        icon: mdi:progress-check
        state: >
          {% set expected = state_attr('sensor.wakeword_positive_session', 'expected_attempts') | int(0) %}
          {% set observed = state_attr('sensor.wakeword_positive_session', 'wake_files_since_start') | int(0) %}
          {% if is_state('sensor.wakeword_positive_session', 'active') and expected > 0 %}
            {{ observed }}/{{ expected }}
          {% elif is_state('sensor.wakeword_positive_session', 'active') %}
            {{ observed }}
          {% else %}
            idle
          {% endif %}
        attributes:
          phrase: "{{ states('input_select.wakeword_collection_phrase') }}"
          speaker: "{{ states('input_select.wakeword_collection_speaker') }}"
          style: "{{ states('input_select.wakeword_collection_style') }}"
          location: "{{ states('input_select.wakeword_collection_location') }}"
          notes: "{{ states('input_text.wakeword_collection_notes') }}"
          plan_step: "{{ states('input_number.wakeword_collection_plan_step') | int(1) }}"
          real_positive_files_total: "{{ state_attr('sensor.wakeword_positive_session', 'real_positive_files_total') | int(0) }}"
          session_summaries_total: "{{ state_attr('sensor.wakeword_positive_session', 'session_summaries_total') | int(0) }}"

script:
  wakeword_collection_show_guide:
    alias: "Wakeword: show collection guide"
    mode: single
    sequence:
      - service: persistent_notification.create
        data:
          title: "Гайд по записи wake word"
          message: >
            Цель: собрать реальные positive-примеры для Милоша. Начните
            сессию, затем произносите выбранную фразу с паузой 3-5 секунд
            между попытками.

            Minimum useful set:
            1. Owner, quiet: 30 x "эй Милош", 20 x "Милош".
            2. Owner, distance: 20 x from sofa or hallway.
            3. Owner, whisper/loud: 10 whisper, 10 loud, 10 tired/low voice.
            4. Noise: 20 x with TV/music, 20 x from kitchen/noisy room.
            5. Other people: 20-30 x per person.

            Для каждого блока выберите говорящего, стиль, место/шум и число
            попыток, затем нажмите "Начать". Когда блок закончен, нажмите
            "Завершить". Если фраза не сработала, просто подождите 3-5 секунд
            и повторите; не надо тараторить.

  wakeword_collection_start:
    alias: "Wakeword: start positive session"
    mode: single
    sequence:
      - variables:
          phrase: "{{ states('input_select.wakeword_collection_phrase') }}"
          expected_attempts: "{{ states('input_number.wakeword_collection_expected_attempts') | int(30) }}"
          speaker: "{{ states('input_select.wakeword_collection_speaker') }}"
          style: "{{ states('input_select.wakeword_collection_style') }}"
          location: "{{ states('input_select.wakeword_collection_location') }}"
      - service: shell_command.wakeword_positive_session_start
        data:
          phrase: "{{ phrase }}"
          speaker: "{{ speaker }}"
          style: "{{ style }}"
          location: "{{ location }}"
          expected_attempts: "{{ expected_attempts }}"
      - service: input_boolean.turn_on
        target:
          entity_id: input_boolean.wakeword_collection_active
      - service: persistent_notification.create
        data:
          title: "Запись wake word начата"
          message: >
            Сессия начата для "{{ phrase }}".
            Говорящий={{ speaker }}, стиль={{ style }}, место={{ location }}.
            Произнесите {{ expected_attempts }} раз с паузой 3-5 секунд.
            Когда блок закончен, нажмите "Завершить".

  wakeword_collection_finish:
    alias: "Wakeword: finish positive session"
    mode: single
    sequence:
      - variables:
          expected_attempts: "{{ states('input_number.wakeword_collection_expected_attempts') | int(30) }}"
      - service: shell_command.wakeword_positive_session_finish
        data:
          expected_attempts: "{{ expected_attempts }}"
      - service: input_boolean.turn_off
        target:
          entity_id: input_boolean.wakeword_collection_active
      - service: counter.increment
        target:
          entity_id: counter.wakeword_collection_blocks_done
      - service: input_number.increment
        target:
          entity_id: input_number.wakeword_collection_plan_step
      - service: persistent_notification.create
        data:
          title: "Запись wake word завершена"
          message: >
            Сессия завершена. Wake-файлы скопированы в
            /home/ultra/oww-dataset/positives/real_user/.
            Данные обновятся в sensor.wakeword_positive_session.

  wakeword_collection_mark_block_done:
    alias: "Wakeword: mark block done"
    mode: single
    sequence:
      - service: counter.increment
        target:
          entity_id: counter.wakeword_collection_blocks_done
      - service: input_number.increment
        target:
          entity_id: input_number.wakeword_collection_plan_step
      - service: persistent_notification.create
        data:
          title: "Блок wake word отмечен"
          message: >
            Блок отмечен как выполненный. Выберите следующего говорящего,
            стиль и место, затем начните новую сессию, когда будете готовы.

automation:
  - id: wakeword_collection_show_guide_button
    alias: "Wakeword Collection: show guide button"
    trigger:
      - platform: state
        entity_id: input_button.wakeword_collection_show_guide
    action:
      - service: script.wakeword_collection_show_guide
    mode: single

  - id: wakeword_collection_start_button
    alias: "Wakeword Collection: start button"
    trigger:
      - platform: state
        entity_id: input_button.wakeword_collection_start
    action:
      - service: script.wakeword_collection_start
    mode: single

  - id: wakeword_collection_finish_button
    alias: "Wakeword Collection: finish button"
    trigger:
      - platform: state
        entity_id: input_button.wakeword_collection_finish
    action:
      - service: script.wakeword_collection_finish
    mode: single

  - id: wakeword_collection_next_block_button
    alias: "Wakeword Collection: next block button"
    trigger:
      - platform: state
        entity_id: input_button.wakeword_collection_next_block
    action:
      - service: script.wakeword_collection_mark_block_done
    mode: single
