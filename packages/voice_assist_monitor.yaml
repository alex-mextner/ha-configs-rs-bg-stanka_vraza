# Voice Assist Monitor & Tune Package
# Real-time pipeline state, tuning controls, debug recordings, latency metrics

# ── Input helpers for live tuning ──
input_number:
  wake_word_sensitivity:
    name: "Wake Word Sensitivity"
    min: 0.1
    max: 1.0
    step: 0.1
    unit_of_measurement: ""
    icon: mdi:ear-hearing
    initial: 0.7

  mic_noise_suppression:
    name: "Mic Noise Suppression"
    min: 0
    max: 4
    step: 1
    unit_of_measurement: ""
    icon: mdi:noise-off
    initial: 3

  mic_auto_gain:
    name: "Mic Auto Gain"
    min: 0
    max: 31
    step: 1
    unit_of_measurement: ""
    icon: mdi:volume-high
    initial: 15

  mute_after_awake:
    name: "Mute After Awake"
    min: 0
    max: 3
    step: 0.5
    unit_of_measurement: "s"
    icon: mdi:microphone-off
    initial: 1.5

# ── Toggle debug recording persistence ──
input_boolean:
  voice_debug_recording:
    name: "Save Debug Recordings"
    icon: mdi:record-rec
    initial: true

  tv_noise_mode:
    name: "TV Noise Mode"
    icon: mdi:television-speaker
    initial: false

# ── Latency tracking timestamps ──
input_datetime:
  pipeline_start_time:
    name: "Pipeline Start"
    has_date: true
    has_time: true
    icon: mdi:timer-play-outline

  stt_done_time:
    name: "STT Done"
    has_date: true
    has_time: true
    icon: mdi:timer-stop-outline

  llm_done_time:
    name: "LLM Done"
    has_date: true
    has_time: true
    icon: mdi:brain

  tts_done_time:
    name: "TTS Done"
    has_date: true
    has_time: true
    icon: mdi:speaker

  last_wake_time:
    name: "Last Wake Time"
    has_date: true
    has_time: true
    icon: mdi:ear-hearing

counter:
  wake_word_detections_today:
    name: "Wake Detections Today"
    icon: mdi:counter
    initial: 0
    step: 1

# ── Template sensors for pipeline state & latency ──
template:
  - sensor:
      - name: "Voice Pipeline Stage"
        unique_id: voice_pipeline_stage
        state: >
          {{ states('assist_satellite.jarvis') | default('idle') }}
        attributes:
          last_wake: "{{ state_attr('sensor.last_wake_word', 'last_detection') | default('never') }}"

      - name: "Last Wake Word"
        unique_id: last_wake_word
        state: >
          {% set t = states('input_datetime.pipeline_start_time') %}
          {% if t not in ['unknown','unavailable','none',''] %}
            {{ as_timestamp(t) | timestamp_custom('%H:%M:%S') }}
          {% else %}
            —
          {% endif %}
        attributes:
          raw_datetime: "{{ states('input_datetime.pipeline_start_time') | default('never') }}"

      - name: "Last STT Text"
        unique_id: last_stt_text
        state: >
          {{ states('input_text.last_voice_request') | default('—') }}

      - name: "Last TTS Text"
        unique_id: last_tts_text
        state: >
          {{ states('input_text.last_voice_response') | default('—') }}

      - name: "Pipeline Total Latency"
        unique_id: pipeline_total_latency
        unit_of_measurement: "s"
        state_class: measurement
        state: >
          {% set start = states('input_datetime.pipeline_start_time') %}
          {% set end = states('input_datetime.llm_done_time') %}
          {% if start not in ['unknown','unavailable','none',''] and end not in ['unknown','unavailable','none',''] %}
            {{ ((as_timestamp(end) - as_timestamp(start)) | round(2)) }}
          {% else %}
            0
          {% endif %}

      - name: "STT Latency"
        unique_id: stt_latency
        unit_of_measurement: "s"
        state_class: measurement
        state: >
          {% set start = states('input_datetime.pipeline_start_time') %}
          {% set end = states('input_datetime.stt_done_time') %}
          {% if start not in ['unknown','unavailable','none',''] and end not in ['unknown','unavailable','none',''] %}
            {{ ((as_timestamp(end) - as_timestamp(start)) | round(2)) }}
          {% else %}0{% endif %}

      - name: "LLM Latency"
        unique_id: llm_latency
        unit_of_measurement: "s"
        state_class: measurement
        state: >
          {% set start = states('input_datetime.stt_done_time') %}
          {% set end = states('input_datetime.llm_done_time') %}
          {% if start not in ['unknown','unavailable','none',''] and end not in ['unknown','unavailable','none',''] %}
            {{ ((as_timestamp(end) - as_timestamp(start)) | round(2)) }}
          {% else %}0{% endif %}

      - name: "TTS Latency"
        unique_id: tts_latency
        unit_of_measurement: "s"
        state_class: measurement
        state: >
          {% set start = states('input_datetime.llm_done_time') %}
          {% set end = states('input_datetime.tts_done_time') %}
          {% if start not in ['unknown','unavailable','none',''] and end not in ['unknown','unavailable','none',''] %}
            {{ ((as_timestamp(end) - as_timestamp(start)) | round(2)) }}
          {% else %}
            0
          {% endif %}

      - name: "LLM Provider Health"
        unique_id: llm_provider_health
        state: >
          {{ states('conversation.home_generative_agent_2') | default('unknown') }}
        attributes:
          last_response_time: "{{ state_attr('conversation.home_generative_agent_2', 'last_response_time') | default('unknown') }}"

      - name: "Latest Debug Recording"
        unique_id: latest_debug_recording
        state: >
          {% set files = states('sensor.debug_files_list') | default('') %}
          {% if files %}
            {{ files.split(',') | first }}
          {% else %}
            none
          {% endif %}
        attributes:
          folder: "/home/ultra/wyoming-debug"
          listed_count: "{{ (states('sensor.debug_files_list') | default('')).split(',') | length }}"

# ── Shell commands to restart voice services with new settings ──
shell_command:
  voice_restart_services: "docker compose -f /home/ultra/homeassistant/ha.docker-compose.yaml up -d --force-recreate wyoming-openwakeword wyoming-satellite"
  voice_restart_satellite: "docker compose -f /home/ultra/homeassistant/ha.docker-compose.yaml up -d --force-recreate wyoming-satellite"
  voice_stop_recording: "docker compose -f /home/ultra/homeassistant/ha.docker-compose.yaml stop wyoming-satellite"
  voice_start_recording: "docker compose -f /home/ultra/homeassistant/ha.docker-compose.yaml start wyoming-satellite"
  voice_play_last_wake: "docker exec homeassistant-wyoming-satellite-1 sh -c 'aplay -D plughw:CARD=ArrayUAC10,DEV=0 $(ls -1t /tmp/debug/*-wake.wav | head -n1)' 2>/dev/null || echo 'failed'"
  voice_play_last_stt: "docker exec homeassistant-wyoming-satellite-1 sh -c 'aplay -D plughw:CARD=ArrayUAC10,DEV=0 $(ls -1t /tmp/debug/*-stt.wav | head -n1)' 2>/dev/null || echo 'failed'"
  voice_play_awake: "docker exec homeassistant-wyoming-satellite-1 sh -c 'aplay -D plughw:CARD=ArrayUAC10,DEV=0 /app/sounds/awake.wav' 2>/dev/null || echo 'failed'"
  voice_play_done: "docker exec homeassistant-wyoming-satellite-1 sh -c 'aplay -D plughw:CARD=ArrayUAC10,DEV=0 /app/sounds/done.wav' 2>/dev/null || echo 'failed'"

# ── Automations: latency tracking ──
automation:
  - id: voice_track_pipeline_start
    alias: "Voice: Track Pipeline Start"
    trigger:
      - platform: state
        entity_id: assist_satellite.jarvis
        from: "idle"
        to: "listening"
    action:
      - service: input_datetime.set_datetime
        target:
          entity_id: input_datetime.pipeline_start_time
        data:
          datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
    mode: single

  - id: voice_track_stt_done
    alias: "Voice: Track STT Done"
    trigger:
      - platform: state
        entity_id: assist_satellite.jarvis
        from: "listening"
        to: "processing"
    action:
      - service: input_datetime.set_datetime
        target:
          entity_id: input_datetime.stt_done_time
        data:
          datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
    mode: single

  - id: voice_track_llm_done
    alias: "Voice: Track LLM Done"
    trigger:
      - platform: state
        entity_id: conversation.home_generative_agent_2
    condition:
      - condition: template
        value_template: "{{ trigger.from_state.state != trigger.to_state.state }}"
    action:
      - service: input_datetime.set_datetime
        target:
          entity_id: input_datetime.llm_done_time
        data:
          datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
    mode: single

  - id: voice_track_tts_done
    alias: "Voice: Track TTS Done"
    trigger:
      - platform: state
        entity_id: tts.dzharvis_dzharvis
    condition:
      - condition: template
        value_template: "{{ trigger.from_state.state != trigger.to_state.state }}"
    action:
      - service: input_datetime.set_datetime
        target:
          entity_id: input_datetime.tts_done_time
        data:
          datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
    mode: single

  - id: voice_apply_sensitivity
    alias: "Voice: Apply Sensitivity Change"
    trigger:
      - platform: state
        entity_id: input_number.wake_word_sensitivity
    action:
      - service: notify.persistent_notification
        data:
          title: "Wake Word Tune"
          message: "Sensitivity changed to {{ states('input_number.wake_word_sensitivity') }}. Restart voice services to apply."
    mode: single

  - id: voice_log_detection
    alias: "Voice: Log Wake Word Detection"
    trigger:
      - platform: state
        entity_id: sensor.last_wake_word
    condition:
      - condition: template
        value_template: "{{ trigger.to_state.state != '—' and trigger.to_state.state != trigger.from_state.state }}"
    action:
      - service: logbook.log
        data:
          name: "Wake Word"
          message: "Detected at {{ trigger.to_state.state }} (pipeline started)"
      - service: input_datetime.set_datetime
        target:
          entity_id: input_datetime.last_wake_time
        data:
          datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
      - service: counter.increment
        target:
          entity_id: counter.wake_word_detections_today

  - id: voice_reset_counter
    alias: "Voice: Reset Daily Wake Counter"
    trigger:
      - platform: time
        at: "00:00:00"
    action:
      - service: counter.reset
        target:
          entity_id: counter.wake_word_detections_today

  - id: voice_tv_noise_mode_on
    alias: "Voice: TV Noise Mode ON"
    trigger:
      - platform: state
        entity_id: media_player.televizor
        to: "on"
    condition:
      - condition: state
        entity_id: input_boolean.tv_noise_mode
        state: "off"
    action:
      - service: input_boolean.turn_on
        target:
          entity_id: input_boolean.tv_noise_mode
      - service: input_number.set_value
        target:
          entity_id: input_number.mic_noise_suppression
        data:
          value: 4
      - service: input_number.set_value
        target:
          entity_id: input_number.mute_after_awake
        data:
          value: 2.5
      - service: input_number.set_value
        target:
          entity_id: input_number.wake_word_sensitivity
        data:
          value: 0.4
      - service: notify.persistent_notification
        data:
          title: "TV Noise Mode"
          message: "TV включен. Шумоподавление NS=4, mute=2.5s, sensitivity=0.4 (менее чувствительно к ложным срабатываниям). Перезапуск voice services..."
      - service: shell_command.voice_restart_services
    mode: single

  - id: voice_tv_noise_mode_off
    alias: "Voice: TV Noise Mode OFF"
    trigger:
      - platform: state
        entity_id: media_player.televizor
        to: "off"
    condition:
      - condition: state
        entity_id: input_boolean.tv_noise_mode
        state: "on"
    action:
      - service: input_boolean.turn_off
        target:
          entity_id: input_boolean.tv_noise_mode
      - service: input_number.set_value
        target:
          entity_id: input_number.mic_noise_suppression
        data:
          value: 3
      - service: input_number.set_value
        target:
          entity_id: input_number.mute_after_awake
        data:
          value: 1.5
      - service: input_number.set_value
        target:
          entity_id: input_number.wake_word_sensitivity
        data:
          value: 0.7
      - service: notify.persistent_notification
        data:
          title: "TV Noise Mode"
          message: "TV выключен. Возвращены стандартные настройки voice. Перезапуск voice services..."
      - service: shell_command.voice_restart_services
    mode: single

# ── Command line sensor: container health ──
command_line:
  - sensor:
      name: "Wyoming Satellite Health"
      unique_id: wyoming_satellite_health
      command: "nc -z wyoming-satellite 10700 && echo running || echo stopped"
      scan_interval: 30
      value_template: "{{ value }}"

  - sensor:
      name: "Wyoming OpenWakeWord Health"
      unique_id: wyoming_porcupine1_health
      command: "nc -z wyoming-openwakeword 10400 && echo running || echo stopped"
      scan_interval: 30
      value_template: "{{ value }}"

  - sensor:
      name: "Debug Files List"
      unique_id: debug_files_list
      command: "ls -1t /config/wyoming-debug/*.wav 2>/dev/null | head -n 8 | sed 's|/config/wyoming-debug/||' | paste -sd ',' - || echo ''"
      scan_interval: 30
      value_template: "{{ value }}"

  - sensor:
      name: "Debug Recording Count"
      unique_id: debug_recording_count
      command: "ls -1 /config/wyoming-debug/*.wav 2>/dev/null | wc -l"
      scan_interval: 30
      value_template: "{{ value | int(0) }}"
