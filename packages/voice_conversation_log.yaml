# Real-time Voice Conversation Log
# Tracks last request, response, and provides stop/pause control

input_text:
  last_voice_request:
    name: "Last Voice Request"
    icon: mdi:microphone-message
    max: 255
    initial: ""

  last_voice_response:
    name: "Last Voice Response"
    icon: mdi:message-reply-text
    max: 255
    initial: ""

  conversation_history:
    name: "Conversation History"
    icon: mdi:history
    max: 255
    initial: ""

input_boolean:
  voice_pipeline_paused:
    name: "Pause Voice Pipeline"
    icon: mdi:pause-octagon
    initial: false

automation:
  - id: voice_log_request
    alias: "Voice: Log Request"
    trigger:
      - platform: state
        entity_id: assist_satellite.jarvis
        from: "listening"
        to: "processing"
    condition:
      - condition: state
        entity_id: input_boolean.voice_pipeline_paused
        state: "off"
    action:
      - service: input_text.set_value
        target:
          entity_id: input_text.last_voice_request
        data:
          value: "[{{ now().strftime('%H:%M') }}] Wake word detected — processing command"
      - service: input_text.set_value
        target:
          entity_id: input_text.conversation_history
        data:
          value: >
            {% set hist = states('input_text.conversation_history') | default('') %}
            {% set line = '[' ~ now().strftime('%H:%M') ~ '] listening -> processing (wake word)' %}
            {{ [hist, line] | select('defined') | join('\n') | trim }}
    mode: single

  - id: voice_log_response
    alias: "Voice: Log Response"
    trigger:
      - platform: state
        entity_id: assist_satellite.jarvis
        from: "processing"
        to: "responding"
    condition:
      - condition: state
        entity_id: input_boolean.voice_pipeline_paused
        state: "off"
    action:
      - service: input_text.set_value
        target:
          entity_id: input_text.last_voice_response
        data:
          value: "[{{ now().strftime('%H:%M') }}] Response ready — TTS playing"
      - service: input_text.set_value
        target:
          entity_id: input_text.conversation_history
        data:
          value: >
            {% set hist = states('input_text.conversation_history') | default('') %}
            {% set line = '[' ~ now().strftime('%H:%M') ~ '] processing -> responding (TTS)' %}
            {{ [hist, line] | select('defined') | join('\n') | trim }}
    mode: single

  - id: voice_log_pipeline_end
    alias: "Voice: Log Pipeline End"
    trigger:
      - platform: state
        entity_id: assist_satellite.jarvis
        from: "responding"
        to: "idle"
    condition:
      - condition: state
        entity_id: input_boolean.voice_pipeline_paused
        state: "off"
    action:
      - service: input_text.set_value
        target:
          entity_id: input_text.conversation_history
        data:
          value: >
            {% set hist = states('input_text.conversation_history') | default('') %}
            {% set line = '[' ~ now().strftime('%H:%M') ~ '] responding -> idle (done)' %}
            {{ [hist, line] | select('defined') | join('\n') | trim }}
    mode: single

  - id: voice_pause_stop_satellite
    alias: "Voice: Pause Stop Satellite"
    trigger:
      - platform: state
        entity_id: input_boolean.voice_pipeline_paused
        to: "on"
    action:
      - service: shell_command.voice_stop_recording
    mode: single

  - id: voice_resume_start_satellite
    alias: "Voice: Resume Start Satellite"
    trigger:
      - platform: state
        entity_id: input_boolean.voice_pipeline_paused
        to: "off"
    action:
      - service: shell_command.voice_start_recording
    mode: single
