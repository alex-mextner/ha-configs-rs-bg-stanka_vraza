services:
  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:stable
    volumes:
      - /home/ultra/homeassistant:/config
      - /run/dbus:/run/dbus:ro
      - /etc/localtime:/etc/localtime:ro
      - /home/ultra/wyoming-debug:/config/wyoming-debug
      - /home/ultra/oww-dataset:/config/oww-dataset
    ports:
      - "8123:8123"
    restart: unless-stopped
    privileged: true
    stop_grace_period: 2m
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8123/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    networks:
      # ha-net only. No LAN (macvlan) leg: it broke 192.168.0.39:8123 for LAN clients.
      # See docs/network.md.
      ha-net:
        aliases:
          - homeassistant.local

  esphome:
    image: ghcr.io/esphome/esphome:latest
    user: "1000:1000"
    environment:
      - HOME=/config
    volumes:
      - /home/ultra/esphome:/config
    ports:
      - "6052:6052"
    restart: unless-stopped
    networks:
      - ha-net

  music-assistant:
    # Host network (the documented MA requirement; approved 2026-09-25): players fetch audio from
    # the stream server MA announces by IP; on ha-net it announced 172.20.0.10:8097, which no
    # player could reach, so nothing ever played. Only MA moves; HA stays on ha-net and reaches
    # MA at the ha-net gateway http://172.20.0.1:8095; MA reaches HA at http://127.0.0.1:8123.
    image: ghcr.io/music-assistant/server:2.10.4
    user: "1000:1000"
    network_mode: host
    volumes:
      - /home/ultra/music-assistant:/data
      # person_likes plugin (aisis#17): like/unlike in ONE account, used by HA music_accounts.
      # The target follows the image's Python version: re-check it when bumping MA.
      - /home/ultra/homeassistant/docker/music-assistant/person_likes:/app/venv/lib/python3.14/site-packages/music_assistant/providers/person_likes:ro
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "2"

  go2rtc:
    image: alexxit/go2rtc:1.9.9
    user: "1000:1000"
    volumes:
      - /home/ultra/homeassistant/go2rtc.yaml:/config/go2rtc.yaml:ro
    ports:
      - "1984:1984"
      - "8554:8554"
      - "8555:8555/tcp"
      - "8555:8555/udp"
    restart: unless-stopped
    networks:
      - ha-net

  printer-proxy:
    image: nginx:1.27-alpine
    volumes:
      - /home/ultra/homeassistant/printer-proxy.nginx.conf:/etc/nginx/nginx.conf:ro
    expose:
      - "8080"
    restart: unless-stopped
    networks:
      - ha-net

  u1-camera-proxy:
    image: ghcr.io/home-assistant/home-assistant:stable
    user: "1000:1000"
    command: ["python", "/config/scripts/u1_mjpeg_proxy.py"]
    environment:
      - U1_CAMERA_URL=http://192.168.0.26:7125/server/files/camera/monitor.jpg
      - U1_CAMERA_FPS=1.0
      - U1_CAMERA_PORT=8090
      - U1_CAMERA_START_MONITOR=true
      - U1_CAMERA_START_MONITOR_URL=http://192.168.0.26:7125/server/mqtt/publish
      - U1_CAMERA_START_MONITOR_INTERVAL=240
    volumes:
      - /usr/share/fonts:/usr/share/fonts:ro
      - /home/ultra/homeassistant:/config:ro
    expose:
      - "8090"
    restart: unless-stopped
    networks:
      - ha-net

  ssh-server:
    image: linuxserver/openssh-server:latest
    environment:
      - PUID=1000
      - PGID=1000
      - USER_NAME=hassio
      - PASSWORD_ACCESS=true
      - USER_PASSWORD=${SSH_SERVER_PASSWORD:?set SSH_SERVER_PASSWORD in .env}
      - SUDO_ACCESS=true
    volumes:
      - /home/ultra/ssh-data:/config
      - /home/ultra/homeassistant:/homeassistant:ro
    ports:
      - "2222:2222"
    restart: unless-stopped
    networks:
      - ha-net

  wyoming-openwakeword:
    image: rhasspy/wyoming-openwakeword
    user: "1000:1000"
    volumes:
      - /home/ultra/oww-models:/custom-models
    command:
      - --uri
      - tcp://0.0.0.0:10400
      - --custom-model-dir
      - /custom-models
      - --preload-model
      - ey_milosh
      # Wake word disabled on 2026-09-24: ey_milosh fired 100-250 false wakes/day on
      # household TV audio (see WAKEWORD_STATUS.md). prob <= 1.0 never passes, so the
      # service keeps answering the satellite without ever detecting. Restore a real
      # threshold only together with a model that passes wakebench on real noise.
      - --threshold
      - "1.0"
      - --debug
    ports:
      - "10400:10400"
    restart: unless-stopped
    logging:
      driver: json-file
      options: {max-size: "50m", max-file: "3"}
    networks:
      - ha-net

  wyoming-faster-whisper:
    image: wyoming-faster-whisper-cuda
    user: "1000:1000"
    volumes:
      - /home/ultra/wyoming-data:/data
    command:
      - --uri
      - tcp://0.0.0.0:10300
      - --data-dir
      - /data
      - --device
      - cuda
      - --model
      - large-v3-turbo
      - --language
      - auto
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks:
      - ha-net

  wyoming-satellite:
    image: lunyaadev/rhasspy-wyoming-satellite:latest
    user: "1000:1000"
    group_add:
      - audio
    devices:
      - /dev/snd:/dev/snd
    volumes:
      - /home/ultra/sounds:/app/sounds
      - /home/ultra/homeassistant/scripts/wakeword_capture_ch0_record.sh:/app/sounds/wakeword_capture_ch0_record.sh:ro
      - /home/ultra/homeassistant/scripts/wakeword_channel0_tee.py:/app/sounds/wakeword_channel0_tee.py:ro
      - /home/ultra/wyoming-debug:/tmp/debug
      - /home/ultra/oww-dataset:/dataset
    command:
      [
        "--name", "Jarvis",
        "--uri", "tcp://0.0.0.0:10700",
        "--mic-command", "/app/sounds/wakeword_capture_ch0_record.sh",
        "--snd-command", "aplay -D plughw:CARD=ArrayUAC10,DEV=0 -r 22050 -c 1 -f S16_LE -t raw",
        "--wake-uri", "tcp://wyoming-openwakeword:10400",
        "--wake-word-name", "ey_milosh",
        "--awake-wav", "/app/sounds/awake.wav",
        "--tts-played-command", "aplay -D plughw:CARD=ArrayUAC10,DEV=0 /app/sounds/done.wav",
        "--mic-noise-suppression", "3",
        "--mic-auto-gain", "15",
        "--mic-seconds-to-mute-after-awake-wav", "1.5",
        "--no-zeroconf", "--debug", "--debug-recording-dir", "/tmp/debug",
      ]
    restart: unless-stopped
    logging:
      driver: json-file
      options: {max-size: "50m", max-file: "3"}
    networks:
      - ha-net

  respeaker-tuning:
    # Reads the XMOS XVF-3000 direction-of-arrival and voice detectors over USB
    # (scripts/respeaker_tuning_service.py). Starts as root only to open the USB
    # device node, then drops to 1000:1000; no capabilities besides setuid/setgid.
    build: ./docker/respeaker-tuning
    image: respeaker-tuning:local
    user: "0:0"
    cap_drop: [ALL]
    cap_add: [SETUID, SETGID]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    network_mode: none
    device_cgroup_rules: ["c 189:* rwm"]
    volumes:
      - /dev/bus/usb:/dev/bus/usb
      - /home/ultra/oww-dataset:/dataset
      - /home/ultra/homeassistant/scripts/respeaker_tuning_service.py:/app/service.py:ro
    restart: unless-stopped
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "2"}

  ollama:
    image: ollama/ollama:latest
    user: "1000:1000"
    environment:
      - OLLAMA_KEEP_ALIVE=5m
      - HOME=/home/ultra
      # 6 GB GPU shared with faster-whisper (and GigaAM/wake jobs): one model at a time,
      # flash attention and a q8 KV cache so the HGA chat model at 8k context stays on the GPU.
      - OLLAMA_FLASH_ATTENTION=1
      - OLLAMA_KV_CACHE_TYPE=q8_0
      - OLLAMA_MAX_LOADED_MODELS=1
      - OLLAMA_NUM_PARALLEL=1
    volumes:
      - /home/ultra/.ollama:/home/ultra/.ollama
    restart: unless-stopped
    deploy:
      resources:
        # CPU-offloaded 8B models once pushed the host into the global OOM killer (2026-09-25).
        limits:
          memory: 5g
          cpus: "6"
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks:
      - ha-net

  ollama-embed:
    # CPU-only Ollama for HGA embeddings (mxbai-embed-large). With one GPU Ollama, every HGA request
    # swapped the chat model out for the embedder and back (18 s + up to 82 s of loading per turn).
    image: ollama/ollama:latest
    user: "1000:1000"
    environment:
      - HOME=/home/ultra
      - OLLAMA_KEEP_ALIVE=24h
      - CUDA_VISIBLE_DEVICES=
      - OLLAMA_NUM_PARALLEL=1
    volumes:
      - /home/ultra/.ollama:/home/ultra/.ollama
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: "2"
    networks:
      - ha-net

  ma-local-audio:
    # The home laptop's own speakers as a Music Assistant player (Sendspin, name «Ноутбук»).
    # ALSA straight to the analog card, so it keeps working while the GNOME session is down;
    # dials out to MA on 127.0.0.1:8927 (host network, no mDNS advertisement needed).
    # Built from the official add-on repo at a pinned commit (the image checks the player SHA).
    build: https://github.com/music-assistant/local-audio-addon.git#a36c35317294cc087eec34bcad5f56a0b0746383
    image: ma-local-audio:a36c35317294
    network_mode: host
    devices:
      - /dev/snd:/dev/snd
    environment:
      SENDSPIN_NAME: Ноутбук
      SENDSPIN_OUTPUT: plughw:CARD=sofhdadsp,DEV=0
      SENDSPIN_SERVER: 127.0.0.1:8927
      SENDSPIN_ID: home-laptop
      SENDSPIN_BUFFER_MS: "250"
    volumes:
      - /home/ultra/ma-local-audio:/data
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "1"

  bgutil-pot:
    # PO-token server for the Music Assistant YouTube Music provider. 2.0.0 fixes an RCE; the
    # server is unauthenticated, so it is published on host loopback only (MA runs on the host
    # network and uses http://127.0.0.1:4416).
    image: brainicism/bgutil-ytdlp-pot-provider:2.0.0
    init: true
    ports:
      - "127.0.0.1:4416:4416"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "1"
    networks:
      - ha-net

  hga-postgres:
    # Long-term memory for Home Generative Agent (LangGraph checkpoints + pgvector store).
    # ha-net only, no published ports; password in .env (HGA_DB_PASSWORD).
    image: pgvector/pgvector:pg17
    environment:
      - POSTGRES_USER=hga
      - POSTGRES_DB=hga
      - POSTGRES_PASSWORD=${HGA_DB_PASSWORD:?set HGA_DB_PASSWORD in .env}
    volumes:
      - /home/ultra/hga-postgres:/var/lib/postgresql/data
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "1"
    networks:
      - ha-net

  openclaw:
    # OpenClaw gateway: central assistant backend (aisis V1 runtime). Official image, pinned by digest.
    # Published on host loopback only; inside the container it listens on 0.0.0.0 ("lan") because
    # a loopback bind would be unreachable through the published port. Token auth: the config holds
    # only an env SecretRef, the value is OPENCLAW_GATEWAY_TOKEN in .env. State and config live in
    # /home/ultra/openclaw (runbook: /home/ultra/openclaw/README.md). Model auth: user onboarding.
    image: ghcr.io/openclaw/openclaw:2026.9.6@sha256:0a5ff5e682e62afa19149df126aa50063bf65ef885b5c94713ce32dc0eb12e15
    user: "1000:1000"
    init: true
    environment:
      HOME: /home/node
      OPENCLAW_HOME: /home/node
      TERM: xterm-256color
      OPENCLAW_STATE_DIR: /home/node/.openclaw
      OPENCLAW_CONFIG_PATH: /home/node/.openclaw/openclaw.json
      OPENCLAW_CONFIG_DIR: /home/node/.openclaw
      OPENCLAW_WORKSPACE_DIR: /home/node/.openclaw/workspace
      OPENCLAW_GATEWAY_PORT: "18789"
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN:?set OPENCLAW_GATEWAY_TOKEN in .env}
      # Key for the chatgpt-web bridge (models.providers.chatgptweb.apiKey is an env SecretRef).
      CHATGPT_WEB_API_KEY: ${CHATGPT_WEB_API_KEY:?set CHATGPT_WEB_API_KEY in .env}
      # No mDNS advertising: avahi-reflector on ha-net would repeat it onto the LAN.
      OPENCLAW_DISABLE_BONJOUR: "1"
      TZ: Europe/Belgrade
    volumes:
      - /home/ultra/openclaw/state:/home/node/.openclaw
      - /home/ultra/openclaw/workspace:/home/node/.openclaw/workspace
      - /home/ultra/openclaw/auth-profile-secrets:/home/node/.config/openclaw
    command: ["node", "dist/index.js", "gateway", "--bind", "lan", "--port", "18789"]
    ports:
      - "127.0.0.1:18789:18789"
    cap_drop:
      - NET_RAW
      - NET_ADMIN
    security_opt:
      - no-new-privileges:true
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "node", "dist/docker-healthcheck.js"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    deploy:
      resources:
        # Idle it already needs ~840 MB (gateway + codex/sqlite helpers); 1g hit the cap at startup.
        # Official docs recommend 2 GB. Swap capped at the same value.
        limits:
          memory: 2g
          cpus: "1"
    memswap_limit: 2g
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "2"}
    networks:
      - ha-net
      - chatgpt-web

  chatgpt-web:
    # OpenAI-compatible bridge from OpenClaw to the ChatGPT web UI (the ChatGPT subscription, not
    # Codex or the paid API). Headed Chrome with its own profile on a private X display. Sign-in and
    # any human check are done only by the user through noVNC on host loopback:
    #   ssh -N -L 6080:127.0.0.1:6080 root@home  ->  http://localhost:6080/vnc.html
    # The API is reachable only on the chatgpt-web network (OpenClaw). docker/chatgpt-web/README.md.
    build: ./docker/chatgpt-web
    image: local/chatgpt-web:1
    environment:
      CHATGPT_WEB_API_KEY: ${CHATGPT_WEB_API_KEY:?set CHATGPT_WEB_API_KEY in .env}
      CHATGPT_WEB_TEMPORARY: "1"
      CHATGPT_WEB_MAX_TABS: "3"
      CHATGPT_WEB_REPLY_TIMEOUT: "300"
      HA_URL: http://host.docker.internal:8123
      HA_TOKEN: ${HA_TOKEN:-}
      TZ: Europe/Belgrade
    volumes:
      - /home/ultra/chatgpt-web:/data
    ports:
      - "127.0.0.1:6080:6080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    shm_size: 1gb
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: "2"
    memswap_limit: 2g
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "2"}
    networks:
      - chatgpt-web

  code-server:
    image: codercom/code-server:latest
    user: "1000:1000"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Moscow
      - SUDO_PASSWORD=${CODE_SERVER_SUDO_PASSWORD:?set CODE_SERVER_SUDO_PASSWORD in .env}
    command: ["--bind-addr", "0.0.0.0:8080", "--auth", "none", "/homeassistant"]
    volumes:
      - /home/ultra/code-server-data:/home/coder
      - /home/ultra/code-server-data/entrypoint.d:/entrypoint.d
      - /home/ultra/homeassistant:/homeassistant
      - /home/ultra/esphome:/esphome:ro
    ports:
      - "8443:8080"
    restart: unless-stopped
    networks:
      - ha-net

  avahi-reflector:
    # mDNS relay LAN <-> ha-net, so HA (bridge network, no LAN leg) discovers Yandex stations,
    # Cast and ESPHome by name although their IPs are plain DHCP. Only this container has a LAN
    # leg (macvlan 192.168.0.5): putting HA itself on the LAN broke access to 192.168.0.39:8123
    # (replies left through the macvlan leg with the wrong source). It serves no ports.
    # Only the service types in the filter are relayed, so HA's own 172.20.x announcement
    # never reaches the LAN (homeassistant.local is published by ha-mdns.service on the host).
    # See docs/network.md.
    image: flungo/avahi@sha256:20f86981a2e6bcc6b6e898ddc51ec9469d3f9cc71fe25b50d26bdaa23ff47ade
    restart: unless-stopped
    environment:
      SERVER_HOST_NAME: ha-mdns-reflector
      SERVER_USE_IPV6: "no"
      REFLECTOR_ENABLE_REFLECTOR: "yes"
      REFLECTOR_REFLECT_FILTERS: "_yandexio._tcp,_googlecast._tcp,_esphomelib._tcp"
    networks:
      ha-net: {}
      lan:
        ipv4_address: 192.168.0.5
    deploy:
      resources:
        limits:
          memory: 64m
          cpus: "0.5"

networks:
  ha-net:
    driver: bridge
  chatgpt-web:
    driver: bridge
  lan:
    # macvlan on the cable NIC for avahi-reflector only. 192.168.0.5 is outside the router's
    # DHCP pool (.10-.254). The host itself can't talk to macvlan children (by design).
    driver: macvlan
    driver_opts:
      parent: enp3s0
    ipam:
      config:
        - subnet: 192.168.0.0/24
          gateway: 192.168.0.1
          ip_range: 192.168.0.5/32
