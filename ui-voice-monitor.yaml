title: Voice Monitor
views:
  - title: Pipeline
    path: pipeline
    badges: []
    cards:
      - type: entities
        title: Service Health
        entities:
          - entity: sensor.wyoming_satellite_health
            name: Satellite
          - entity: sensor.wyoming_porcupine1_health
            name: Porcupine1 Wake Word
          - entity: sensor.llm_provider_health
            name: LLM Provider
        show_header_toggle: false

      - type: entities
        title: Pipeline State
        entities:
          - entity: sensor.voice_pipeline_stage
            name: Current Stage
          - entity: sensor.last_wake_word
            name: Last Wake
          - entity: input_datetime.last_wake_time
            name: Wake Time
          - entity: counter.wake_word_detections_today
            name: Detections Today
        show_header_toggle: false

      - type: entities
        title: Live Tuning
        entities:
          - entity: input_number.wake_word_sensitivity
            name: Sensitivity (restart to apply)
          - entity: input_number.mic_noise_suppression
            name: Noise Suppression
          - entity: input_number.mic_auto_gain
            name: Auto Gain
          - entity: input_number.mute_after_awake
            name: Mute After Awake
        show_header_toggle: false

      - type: button
        name: Restart Voice Services
        tap_action:
          action: call-service
          service: shell_command.voice_restart_services
        hold_action:
          action: none
        show_icon: true
        icon: mdi:restart

      - type: button
        name: Stop Listening
        tap_action:
          action: call-service
          service: shell_command.voice_stop_recording
        icon: mdi:microphone-off

      - type: button
        name: Start Listening
        tap_action:
          action: call-service
          service: shell_command.voice_start_recording
        icon: mdi:microphone

      - type: entities
        title: Last Interaction
        entities:
          - entity: input_text.last_voice_request
            name: Last Request
          - entity: input_text.last_voice_response
            name: Last Response
        show_header_toggle: false

      - type: markdown
        title: Conversation Log
        content: |
          **History:**
          {{ states('input_text.conversation_history') | replace('\n', '<br>') }}

      - type: button
        name: Clear History
        tap_action:
          action: call-service
          service: input_text.set_value
          target:
            entity_id: input_text.conversation_history
          data:
            value: ""
        show_icon: true
        icon: mdi:delete-sweep

      - type: markdown
        content: |
          ## Debug Recordings
          Files are saved to `/home/ultra/wyoming-debug/`.  
          Use **Media Source** or SSH to browse and play.

      - type: entities
        title: Debug Files
        entities:
          - entity: sensor.debug_recording_count
            name: Files stored
          - entity: sensor.latest_debug_recording
            name: Latest file
        show_header_toggle: false

      - type: horizontal-stack
        cards:
          - type: button
            name: Play last wake
            tap_action:
              action: call-service
              service: shell_command.voice_play_last_wake
            hold_action:
              action: none
            show_icon: true
            icon: mdi:ear-hearing
          - type: button
            name: Play last command
            tap_action:
              action: call-service
              service: shell_command.voice_play_last_stt
            hold_action:
              action: none
            show_icon: true
            icon: mdi:microphone-message

      - type: history-graph
        title: Sensitivity Changes
        entities:
          - entity: input_number.wake_word_sensitivity
        hours_to_show: 24
        refresh_interval: 0

      - type: entities
        title: Latency Metrics
        entities:
          - entity: sensor.pipeline_total_latency
            name: Total
          - entity: sensor.stt_latency
            name: STT
          - entity: sensor.llm_latency
            name: LLM
          - entity: sensor.tts_latency
            name: TTS
        show_header_toggle: false

      - type: history-graph
        title: Pipeline Latency (last 24h)
        entities:
          - entity: sensor.pipeline_total_latency
          - entity: sensor.stt_latency
            name: stt
          - entity: sensor.llm_latency
            name: llm
        hours_to_show: 24
        refresh_interval: 0

      - type: entities
        title: TV Noise Mode
        entities:
          - entity: input_boolean.tv_noise_mode
            name: TV Mode Active
          - entity: media_player.televizor
            name: TV State
        show_header_toggle: false
