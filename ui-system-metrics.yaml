title: System & Metrics
views:
  - title: Overview
    path: overview
    cards:
      - type: vertical-stack
        cards:
          - type: entities
            title: System Health
            entities:
              - entity: sensor.system_status
                name: Status
              - entity: sensor.glances_system_summary
                name: Glances Status
              - entity: binary_sensor.system_high_cpu
                name: CPU High
              - entity: binary_sensor.system_high_ram
                name: RAM High
              - entity: binary_sensor.system_high_swap
                name: Swap High
              - entity: binary_sensor.system_high_load
                name: Load High
              - entity: binary_sensor.glances_system_problem
                name: Glances Problem
            show_header_toggle: false

          - type: history-graph
            title: CPU & Load (24h)
            entities:
              - entity: sensor.cpu_usage
                name: CPU
              - entity: sensor.load_average_1m
                name: Load 1m
              - entity: sensor.load_average_5m
                name: Load 5m
              - entity: sensor.load_average_15m
                name: Load 15m
            hours_to_show: 24
            refresh_interval: 0

          - type: history-graph
            title: Memory (24h)
            entities:
              - entity: sensor.memory_usage_percent
                name: RAM %
              - entity: sensor.memory_free_mb
                name: RAM Free
              - entity: sensor.swap_usage_percent
                name: Swap %
            hours_to_show: 24
            refresh_interval: 0

          - type: history-graph
            title: Disk (24h)
            entities:
              - entity: sensor.disk_usage_root
                name: Root
            hours_to_show: 24
            refresh_interval: 0

      - type: vertical-stack
        cards:
          - type: entities
            title: Glances Detail
            entities:
              - entity: sensor.glances_cpu_total
                name: CPU Total
              - entity: sensor.glances_cpu_user
                name: CPU User
              - entity: sensor.glances_cpu_system
                name: CPU System
              - entity: sensor.glances_cpu_iowait
                name: CPU IO Wait
              - entity: sensor.glances_memory_percent
                name: RAM %
              - entity: sensor.glances_memory_available
                name: RAM Available
              - entity: sensor.glances_swap_percent
                name: Swap %
              - entity: sensor.glances_load_1m
                name: Load 1m
              - entity: sensor.glances_load_5m
                name: Load 5m
              - entity: sensor.glances_load_15m
                name: Load 15m
            show_header_toggle: false

          - type: history-graph
            title: Glances CPU & IO Wait (24h)
            entities:
              - entity: sensor.glances_cpu_total
                name: CPU
              - entity: sensor.glances_cpu_iowait
                name: IO Wait
            hours_to_show: 24
            refresh_interval: 0

          - type: history-graph
            title: Glances Memory & Swap (24h)
            entities:
              - entity: sensor.glances_memory_percent
                name: RAM %
              - entity: sensor.glances_swap_percent
                name: Swap %
            hours_to_show: 24
            refresh_interval: 0

      - type: button
        name: Устройства в сети
        icon: mdi:lan
        icon_height: 40px
        show_state: false
        tap_action:
          action: navigate
          navigation_path: /system-metrics/network

  - title: Network
    path: network
    panel: true
    cards:
      - type: custom:network-devices-card
        title: Устройства в сети
        default_filter: recent
        refresh_interval: 60
        dry_run: false
