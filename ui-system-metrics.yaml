title: System & Metrics
views:
  - title: Overview
    path: overview
    cards:
      - type: vertical-stack
        cards:
          - type: entities
            title: System Health
            entities:
              - entity: sensor.system_status
                name: Status
              - entity: sensor.glances_system_summary
                name: Glances Status
              - entity: binary_sensor.system_high_cpu
                name: CPU High
              - entity: binary_sensor.system_high_ram
                name: RAM High
              - entity: binary_sensor.system_high_swap
                name: Swap High
              - entity: binary_sensor.system_high_load
                name: Load High
              - entity: binary_sensor.glances_system_problem
                name: Glances Problem
            show_header_toggle: false

          - type: history-graph
            title: CPU & Load (24h)
            entities:
              - entity: sensor.cpu_usage
                name: CPU
              - entity: sensor.load_average_1m
                name: Load 1m
              - entity: sensor.load_average_5m
                name: Load 5m
              - entity: sensor.load_average_15m
                name: Load 15m
            hours_to_show: 24
            refresh_interval: 0

          - type: history-graph
            title: Memory (24h)
            entities:
              - entity: sensor.memory_usage_percent
                name: RAM %
              - entity: sensor.memory_free_mb
                name: RAM Free
              - entity: sensor.swap_usage_percent
                name: Swap %
            hours_to_show: 24
            refresh_interval: 0

          - type: history-graph
            title: Disk (24h)
            entities:
              - entity: sensor.disk_usage_root
                name: Root
            hours_to_show: 24
            refresh_interval: 0

      - type: vertical-stack
        cards:
          - type: entities
            title: Glances Detail
            entities:
              - entity: sensor.glances_cpu_total
                name: CPU Total
              - entity: sensor.glances_cpu_user
                name: CPU User
              - entity: sensor.glances_cpu_system
                name: CPU System
              - entity: sensor.glances_cpu_iowait
                name: CPU IO Wait
              - entity: sensor.glances_memory_percent
                name: RAM %
              - entity: sensor.glances_memory_available
                name: RAM Available
              - entity: sensor.glances_swap_percent
                name: Swap %
              - entity: sensor.glances_load_1m
                name: Load 1m
              - entity: sensor.glances_load_5m
                name: Load 5m
              - entity: sensor.glances_load_15m
                name: Load 15m
            show_header_toggle: false

          - type: history-graph
            title: Glances CPU & IO Wait (24h)
            entities:
              - entity: sensor.glances_cpu_total
                name: CPU
              - entity: sensor.glances_cpu_iowait
                name: IO Wait
            hours_to_show: 24
            refresh_interval: 0

          - type: history-graph
            title: Glances Memory & Swap (24h)
            entities:
              - entity: sensor.glances_memory_percent
                name: RAM %
              - entity: sensor.glances_swap_percent
                name: Swap %
            hours_to_show: 24
            refresh_interval: 0

      - type: markdown
        title: DHCP Monitor
        content: |
          {% set ns = namespace(rows=[]) %}
          {% set ov = {
            '192.168.0.1': ['Роутер Ubee','mdi:router-network'],
            '192.168.0.39': ['Home Assistant','mdi:home-assistant'],
            '192.168.0.11': ['Windows · Kodi','mdi:microsoft-windows'],
            '192.168.0.18': ['MacBook','mdi:laptop'],
            '192.168.0.22': ['Яндекс Станция','mdi:speaker'],
            '192.168.0.17': ['Яндекс Станция','mdi:speaker']
          } %}
          {% for i in range(1,6) %}
            {% set dev = 'sensor.dhcp_device_' ~ i %}
            {% set ip = states(dev) %}
            {% if ip not in ['unknown','unavailable','Unknown'] and ns.rows|length < 5 %}
              {% set ns.rows = ns.rows + [{'ip':ip,'name': state_attr(dev,'hostname') or (ov[ip][0] if ip in ov else ip),'icon': ov[ip][1] if ip in ov else 'mdi:history'}] %}
            {% endif %}
          {% endfor %}
          {% set ips = ns.rows | map(attribute='ip') | list %}
          {% for d in state_attr('sensor.ubee_devices','devices') or [] %}
            {% if ns.rows|length < 5 and d.ip not in ips and (d.ip in ov or d.identified) %}
              {% set ns.rows = ns.rows + [{'ip':d.ip,'name': ov[d.ip][0] if d.ip in ov else d.name,'icon': ov[d.ip][1] if d.ip in ov else d.icon}] %}
            {% endif %}
          {% endfor %}
          ### <ha-icon icon="mdi:wifi"></ha-icon> Recent devices
          | | | |
          |:-:|:--|--:|
          {% for r in ns.rows -%}
          | <ha-icon icon="{{ r.icon }}"></ha-icon> | **{{ r.name }}** | `{{ r.ip }}` |
          {% endfor -%}
          {% if ns.rows|length == 0 %}_нет данных_{% endif %}

  - title: Voice
    path: voice
    cards:
      - type: vertical-stack
        cards:
          - type: entities
            title: Voice Pipeline Health
            entities:
              - entity: sensor.wyoming_satellite_health
                name: Satellite
              - entity: sensor.wyoming_porcupine1_health
                name: Porcupine1
              - entity: sensor.llm_provider_health
                name: LLM Provider
              - entity: sensor.voice_pipeline_stage
                name: Pipeline Stage
            show_header_toggle: false

          - type: entities
            title: Wake Word Activity
            entities:
              - entity: sensor.last_wake_word
                name: Last Detection
              - entity: input_datetime.last_wake_time
                name: Last Wake Time
              - entity: counter.wake_word_detections_today
                name: Detections Today
            show_header_toggle: false

          - type: history-graph
            title: Latency Breakdown (24h)
            entities:
              - entity: sensor.pipeline_total_latency
                name: Total
              - entity: sensor.stt_latency
                name: STT
              - entity: sensor.llm_latency
                name: LLM
              - entity: sensor.tts_latency
                name: TTS
            hours_to_show: 24
            refresh_interval: 0

          - type: history-graph
            title: Wake Detections per Hour (24h)
            entities:
              - entity: counter.wake_word_detections_today
            hours_to_show: 24
            refresh_interval: 0

      - type: vertical-stack
        cards:
          - type: entities
            title: Live Tuning
            entities:
              - entity: input_number.wake_word_sensitivity
                name: Sensitivity
              - entity: input_number.mic_noise_suppression
                name: Noise Suppression
              - entity: input_number.mic_auto_gain
                name: Auto Gain
              - entity: input_number.mute_after_awake
                name: Mute After Awake
              - entity: input_boolean.voice_pipeline_paused
                name: Pause Pipeline
            show_header_toggle: false

          - type: entities
            title: TV Noise Mode
            entities:
              - entity: input_boolean.tv_noise_mode
                name: TV Mode Active
              - entity: media_player.televizor
                name: TV State
            show_header_toggle: false

          - type: entities
            title: Last Interaction
            entities:
              - entity: input_text.last_voice_request
                name: Last Request
              - entity: input_text.last_voice_response
                name: Last Response
            show_header_toggle: false

          - type: button
            name: Restart Voice Services
            tap_action:
              action: call-service
              service: shell_command.voice_restart_services
            hold_action:
              action: none
            show_icon: true
            icon: mdi:restart

          - type: entities
            title: Debug Recordings
            entities:
              - entity: sensor.debug_recording_count
                name: Files stored
              - entity: sensor.latest_debug_recording
                name: Latest file
            show_header_toggle: false

          - type: horizontal-stack
            cards:
              - type: button
                name: Play last wake (2s before)
                tap_action:
                  action: call-service
                  service: shell_command.voice_play_last_wake
                hold_action:
                  action: none
                show_icon: true
                icon: mdi:ear-hearing
              - type: button
                name: Play last command
                tap_action:
                  action: call-service
                  service: shell_command.voice_play_last_stt
                hold_action:
                  action: none
                show_icon: true
                icon: mdi:microphone-message

          - type: markdown
            content: |
              **What are these?**
              `*-wake.wav` — 2 seconds *before* wake word fired. Listen to understand false activations.
              `*-stt.wav` — your voice command after wake word.

      - type: vertical-stack
        cards:
          - type: markdown
            title: Pipeline Log
            content: |
              **Recent stages:**
              {{ states('input_text.conversation_history') | replace('\n', '<br>') }}

          - type: button
            name: Clear Log
            tap_action:
              action: call-service
              service: input_text.set_value
              target:
                entity_id: input_text.conversation_history
              data:
                value: ""
            show_icon: true
            icon: mdi:delete-sweep

          - type: history-graph
            title: Sensitivity Changes (24h)
            entities:
              - entity: input_number.wake_word_sensitivity
            hours_to_show: 24
            refresh_interval: 0

      - type: vertical-stack
        cards:
          - type: horizontal-stack
            cards:
              - type: button
                name: Stop Listening
                tap_action:
                  action: call-service
                  service: shell_command.voice_stop_recording
                icon: mdi:microphone-off
              - type: button
                name: Start Listening
                tap_action:
                  action: call-service
                  service: shell_command.voice_start_recording
                icon: mdi:microphone
