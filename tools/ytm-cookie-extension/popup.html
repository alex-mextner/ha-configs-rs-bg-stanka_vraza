<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<style>
  body { font: 14px/1.4 system-ui, sans-serif; width: 320px; margin: 12px; }
  button { width: 100%; padding: 10px; font-size: 15px; border-radius: 8px; border: 0; background: #c00; color: #fff; cursor: pointer; }
  #status { margin-top: 10px; }
  code { display: block; margin-top: 6px; padding: 6px; background: #f2f2f2; border-radius: 6px; user-select: all; }
  .muted { color: #666; font-size: 12px; margin-top: 10px; }
</style></head>
<body>
  <button id="copy">Скопировать cookie YouTube Music</button>
  <div id="status"></div>
  <div class="muted">Cookie даёт доступ к аккаунту Google: вставляйте её только в команду ниже. Лучше держать для YouTube Music отдельный профиль Chrome — тогда cookie живёт дольше.</div>
  <script src="popup.js"></script>
</body></html>
