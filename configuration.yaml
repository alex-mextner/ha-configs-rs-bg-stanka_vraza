  resources:
    - url: /local/wakeword/wakeword-collection-card.js?v=20260626a
      type: module
    - url: /webrtc/webrtc-camera.js?v=3.6.1
      type: module
    - url: /local/community/transmission-card/transmission-card.js?v=20260619
