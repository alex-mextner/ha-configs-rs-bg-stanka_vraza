# Load frontend themes from the themes folder
frontend:
  themes: !include_dir_merge_named themes

ingress:
  code_server:
    require_admin: true
    title: Code
    icon: mdi:code-braces
    url: http://code-server:8080
    work_mode: ingress
    ui_mode: normal
  esphome:
    require_admin: true
    title: ESPHome
    icon: mdi:chip
    url: http://esphome:6052
    work_mode: ingress
    ui_mode: normal
  music_assistant:
    require_admin: true
    title: Music Assistant
    icon: mdi:music-box
    # MA runs on the host network (ha-net gateway), see ha.docker-compose.yaml
    url: http://172.20.0.1:8095
    work_mode: ingress
    ui_mode: normal
    # Rotate the ingress URL token daily instead of hourly: every rotation invalidates the
    # cookie of MA panels already open on other devices (broken images, failed reconnects).
    # Access still needs the per-user ha_ingress_session cookie (5 min, refreshed by the page).
    expire_time: 86400
    # Auto-login inside the HA panel: store a long-lived token of the MA user ha_panel in the
    # page served through HA's authenticated ingress path only (never add static_token here).
    # The snippet lives in secrets.yaml. Do not click Logout in the panel: it revokes that token.
    rewrite:
      - mode: body
        path: ^/(index\.html)?$
        name: text/html
        match: '<head>'
        replace: !secret ma_panel_autologin
      # Runs before the snippet above (rules apply in order, each inserts right after <head>):
      # drop a stored MA token that MA rejects (expired, revoked, stale) so the snippet puts
      # the panel token back; a valid token of any user is kept. Without this MA shows its
      # login page and clears the token itself, so only a reload recovered.
      - mode: body
        path: ^/(index\.html)?$
        name: text/html
        match: '<head>'
        replace: '<head><script>try{var k="ma_access_token",t=localStorage.getItem(k);if(t){var x=new XMLHttpRequest();x.open("GET","auth/me",false);x.setRequestHeader("Authorization","Bearer "+t);x.send();if(x.status==401)localStorage.removeItem(k)}}catch(e){}</script>'
      # Only one of the HA and MA sidebars stays expanded, see docs/ma-sidebar-sync.md.
      # Bump ?v= after editing the script.
      - mode: body
        path: ^/(index\.html)?$
        name: text/html
        match: '</head>'
        replace: '<script src="/local/ma-sidebar-sync/ma-sidebar-sync.js?v=1"></script></head>'
      - mode: header
        path: ^/(index\.html)?$
        name: ^etag$
        match: '"$'
        replace: '-ha"'
  transmission:
    require_admin: true
    title: Transmission
    icon: mdi:download-network
    url: http://172.20.0.1:9091
    index: /transmission/web/
    work_mode: ingress
    ui_mode: normal
    static_token: !secret transmission_ingress_token
    rewrite:
      - mode: body
        path: .*/transmission/web/?$
        name: text/html
        match: 'src="./transmission-app.js"'
        replace: 'src="./transmission-app.js?v=ha20260621b"'
      - mode: body
        path: .*/transmission-app\.js(\?.*)?$
        name: application/javascript
        match: '_Root:"\.\./rpc"'
        replace: !secret transmission_rpc_rewrite
  k1_se_printer:
    require_admin: true
    title: K1 SE
    icon: mdi:printer-3d
    url: http://printer-proxy:8080/k1se
    work_mode: ingress
    ui_mode: normal
  u1_printer:
    require_admin: true
    title: U1
    icon: mdi:printer-3d-nozzle
    url: http://printer-proxy:8080/u1
    work_mode: ingress
    ui_mode: normal

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml

