# Replaces default_config (excludes cloud which needs subscription)
assist_pipeline:
bluetooth:
conversation:
dhcp:
energy:
file:
go2rtc:
history:
homeassistant_alerts:
logbook:
media_source:
mobile_app:
my:
ssdp:
stream:
sun:
usage_prediction:
usb:
webhook:
zeroconf:
webrtc:

# Load frontend themes from the themes folder
frontend:
  themes: !include_dir_merge_named themes

ingress:
  code_server:
    require_admin: true
    title: Code
    icon: mdi:code-braces
    url: http://code-server:8080
    work_mode: ingress
    ui_mode: normal
  esphome:
    require_admin: true
    title: ESPHome
    icon: mdi:chip
    url: http://esphome:6052
    work_mode: ingress
    ui_mode: normal
  music_assistant:
    require_admin: true
    title: Music Assistant
    icon: mdi:music-box
    url: http://music-assistant:8095
    work_mode: ingress
    ui_mode: normal
  transmission:
    require_admin: true
    title: Transmission
    icon: mdi:download-network
    url: http://172.20.0.1:9091
    index: /transmission/web/
    work_mode: ingress
    ui_mode: normal
    static_token: 05ed74a62475c41b58cec6aa74d00f31c86e665498b7b8c1
    rewrite:
      - mode: body
        path: .*/transmission/web/?$
        name: text/html
        match: 'src="./transmission-app.js"'
        replace: 'src="./transmission-app.js?v=ha20260621b"'
      - mode: body
        path: .*/transmission-app\.js(\?.*)?$
        name: application/javascript
        match: '_Root:"\.\./rpc"'
        replace: '_Root:"/api/ingress/t-05ed74a62475c41b58cec6aa74d00f31c86e665498b7b8c1/transmission/rpc"'
  k1_se_printer:
    require_admin: true
    title: K1 SE
    icon: mdi:printer-3d
    url: http://printer-proxy:8080/k1se
    work_mode: ingress
    ui_mode: normal
  u1_printer:
    require_admin: true
    title: U1
    icon: mdi:printer-3d-nozzle
    url: http://printer-proxy:8080/u1
    work_mode: ingress
    ui_mode: normal

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml

device_tracker:
  - platform: ubee
    host: 192.168.0.1
    username: admin
    password: !secret ubee_password
    model: EVW32C-0N

