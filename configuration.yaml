yandex_station:
  domain: yandex.com
  ssl: false
  # No hardcoded speaker IPs (they are DHCP, the router has few reservations).
  # Local hosts come from mDNS: HA sits on ha-net, and the compose service
  # avahi-reflector relays _yandexio._tcp from the LAN (docs/network.md).
  # The integration keeps its mDNS browser running, so a new DHCP address is
  # picked up without a restart. All three stations run in local mode
  # (verified 2026-09-26).

rutracker_transmission:
  host_login_url: !secret rutracker_browser_login_url
  host_actions_token: !secret host_actions_token

logger:
  default: info

homeassistant:
  internal_url: "http://192.168.0.39:8123"
  packages: !include_dir_named packages

