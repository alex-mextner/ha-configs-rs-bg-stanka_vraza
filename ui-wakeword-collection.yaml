# Voice studio. The old Милош-specific views were replaced on 2026-09-25 by the
# phrase-agnostic Studio card (www/wakeword/wakeword-studio-card.js); its data
# and audio come from the authenticated /api/wakeword_studio/* backend.
title: Голос
views:
  - title: Студия
    path: collection
    icon: mdi:microphone-message
    panel: true
    cards:
      - type: custom:wakeword-studio-card

  # Voice pipeline health, tuning and debug recordings (moved from the System & Metrics
  # "Voice" view on 2026-09-25 so that everything about voice lives on this dashboard).
  - title: Пайплайн
    path: pipeline
    icon: mdi:waveform
    cards:
      - type: vertical-stack
        cards:
          - type: entities
            title: Voice Pipeline Health
            entities:
              - entity: sensor.wyoming_satellite_health
                name: Satellite
              - entity: sensor.wyoming_porcupine1_health
                name: Porcupine1
              - entity: sensor.llm_provider_health
                name: LLM Provider
              - entity: sensor.voice_pipeline_stage
                name: Pipeline Stage
            show_header_toggle: false

          - type: entities
            title: Wake Word Activity
            entities:
              - entity: sensor.last_wake_word
                name: Last Detection
              - entity: input_datetime.last_wake_time
                name: Last Wake Time
              - entity: counter.wake_word_detections_today
                name: Detections Today
            show_header_toggle: false

          - type: history-graph
            title: Latency Breakdown (24h)
            entities:
              - entity: sensor.pipeline_total_latency
                name: Total
              - entity: sensor.stt_latency
                name: STT
              - entity: sensor.llm_latency
                name: LLM
              - entity: sensor.tts_latency
                name: TTS
            hours_to_show: 24
            refresh_interval: 0

          - type: history-graph
            title: Wake Detections per Hour (24h)
            entities:
              - entity: counter.wake_word_detections_today
            hours_to_show: 24
            refresh_interval: 0

      - type: vertical-stack
        cards:
          - type: entities
            title: Live Tuning
            entities:
              - entity: input_number.wake_word_sensitivity
                name: Sensitivity
              - entity: input_number.mic_noise_suppression
                name: Noise Suppression
              - entity: input_number.mic_auto_gain
                name: Auto Gain
              - entity: input_number.mute_after_awake
                name: Mute After Awake
              - entity: input_boolean.voice_pipeline_paused
                name: Pause Pipeline
            show_header_toggle: false

          - type: entities
            title: TV Noise Mode
            entities:
              - entity: input_boolean.tv_noise_mode
                name: TV Mode Active
              - entity: media_player.televizor
                name: TV State
            show_header_toggle: false

          - type: entities
            title: Last Interaction
            entities:
              - entity: input_text.last_voice_request
                name: Last Request
              - entity: input_text.last_voice_response
                name: Last Response
            show_header_toggle: false

          - type: button
            name: Restart Voice Services
            tap_action:
              action: call-service
              service: shell_command.voice_restart_services
            hold_action:
              action: none
            show_icon: true
            icon: mdi:restart

          - type: entities
            title: Debug Recordings
            entities:
              - entity: sensor.debug_recording_count
                name: Files stored
              - entity: sensor.latest_debug_recording
                name: Latest file
            show_header_toggle: false

          - type: horizontal-stack
            cards:
              - type: button
                name: Play last wake (2s before)
                tap_action:
                  action: call-service
                  service: shell_command.voice_play_last_wake
                hold_action:
                  action: none
                show_icon: true
                icon: mdi:ear-hearing
              - type: button
                name: Play last command
                tap_action:
                  action: call-service
                  service: shell_command.voice_play_last_stt
                hold_action:
                  action: none
                show_icon: true
                icon: mdi:microphone-message

          - type: markdown
            content: |
              **What are these?**
              `*-wake.wav` — 2 seconds *before* wake word fired. Listen to understand false activations.
              `*-stt.wav` — your voice command after wake word.

      - type: vertical-stack
        cards:
          - type: markdown
            title: Pipeline Log
            content: |
              **Recent stages:**
              {{ states('input_text.conversation_history') | replace('\n', '<br>') }}

          - type: button
            name: Clear Log
            tap_action:
              action: call-service
              service: input_text.set_value
              target:
                entity_id: input_text.conversation_history
              data:
                value: ""
            show_icon: true
            icon: mdi:delete-sweep

          - type: history-graph
            title: Sensitivity Changes (24h)
            entities:
              - entity: input_number.wake_word_sensitivity
            hours_to_show: 24
            refresh_interval: 0

      - type: vertical-stack
        cards:
          - type: horizontal-stack
            cards:
              - type: button
                name: Stop Listening
                tap_action:
                  action: call-service
                  service: shell_command.voice_stop_recording
                icon: mdi:microphone-off
              - type: button
                name: Start Listening
                tap_action:
                  action: call-service
                  service: shell_command.voice_start_recording
                icon: mdi:microphone
